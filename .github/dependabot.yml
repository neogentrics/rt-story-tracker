version: 2
updates:
  # The old app in legacy-wpf has .NET packages of its own. It isn't built any more, so it isn't watched.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Each pull request runs the whole of CI on three systems, so only a few are open at a time.
    open-pull-requests-limit: 3
    ignore:
      # Its version is set by the shared code this app takes in (core.lock), and a test fails if the two differ. It moves when the
      # shared code does.
      - dependency-name: onnxruntime-web
    groups:
      editor:
        patterns: ['@tiptap/*']
      fonts:
        patterns: ['@fontsource/*']
      documents:
        patterns: ['diff', 'docx', 'fast-xml-parser', 'fflate', 'mammoth', 'markdown-it', 'parse5', 'pdf-lib', 'pdfjs-dist']
      build-tools:
        patterns: ['electron', 'electron-builder', 'epubchecker', 'esbuild', 'playwright-core']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
